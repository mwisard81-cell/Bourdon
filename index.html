<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bourdon</title>
<meta name="theme-color" content="#111413">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
  :root { --bg: #ECEEE9; --panel: #F8F9F5; --ink: #1B211F; --muted: #5C6763; --line: #D3D8D0; --honey: #C98207; --honey-ink: #2B1A00; --honey-shadow: #9C6405; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111413; --panel: #191D1B; --ink: #ECEFEA; --muted: #98A39E; --line: #2A302D; --honey: #F0A92A; --honey-ink: #231500; --honey-shadow: #A86F0E; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
  body { font: 15px/1.45 "Instrument Sans", system-ui, -apple-system, sans-serif; display: grid; place-items: center; min-height: 100vh; padding: 16px; }
  .lock { width: min(360px, 100%); padding: 24px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); }
  .mark { display: grid; grid-template-columns: repeat(2, 9px); gap: 3px; margin-bottom: 14px; }
  .mark i { width: 9px; height: 9px; border-radius: 2.5px; background: var(--line); }
  .mark i.on { background: var(--honey); }
  h1 { margin: 0 0 6px; font: 700 22px/1.2 "Unbounded", system-ui, sans-serif; letter-spacing: -.02em; }
  p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
  input[type="password"] { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; }
  .check { display: flex; gap: 8px; align-items: center; margin: 14px 0 0; font-size: 14px; color: var(--muted); font-weight: 500; }
  button { width: 100%; height: 46px; margin-top: 16px; border: 0; border-radius: 12px; background: var(--honey); color: var(--honey-ink); font-family: inherit; font-weight: 700; font-size: 15px; box-shadow: 0 3px 0 var(--honey-shadow); cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .err { min-height: 1.4em; margin: 12px 0 0; color: #B3261E; font-size: 14px; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .err { color: #FFB4AB; } }
</style>
</head>
<body>
<main class="lock">
  <div class="mark" aria-hidden="true"><i class="on"></i><i></i><i></i><i class="on"></i></div>
  <h1>Bourdon</h1>
  <p>Cette appli est protégée. Entre le mot de passe pour l'ouvrir. Les majuscules et les espaces ne comptent pas.</p>
  <form id="form" autocomplete="on">
    <label for="pw">Mot de passe</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <label class="check"><input id="remember" type="checkbox" checked> Rester déverrouillé sur cet appareil</label>
    <button id="go" type="submit">Ouvrir</button>
    <p id="err" class="err" role="alert"></p>
  </form>
</main>

  if (saved) {
    crypto.subtle.importKey('raw', saved, { name: 'AES-GCM' }, false, ['decrypt'])
      .then(key => openWith(key))
      .catch(() => { try { localStorage.removeItem(KEY_STORE); } catch (e) { /* ignoré */ } });
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Ouverture…';
    try {
      const key = await derive(document.getElementById('pw').value);
      await openWith(key);
    } catch (ex) {
      err.textContent = 'Mot de passe incorrect.';
      btn.disabled = false;
      btn.textContent = 'Ouvrir';
    }
  });

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
